<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="180" height="180" role="img" aria-label="Spinning ship's helm, styled after the Kubernetes wheel">
  <defs>
    <radialGradient id="hubGradient" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8AB4FF"/>
      <stop offset="55%" stop-color="#4D8DFF"/>
      <stop offset="100%" stop-color="#1B4F9C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#326CE5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#326CE5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="100" rx="95" ry="95" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="7s" repeatCount="indefinite"/>

      <circle cx="100" cy="100" r="70" fill="none" stroke="#326CE5" stroke-width="9"/>

      <g stroke="#326CE5" stroke-width="7" stroke-linecap="round">
        <line x1="120.00" y1="100.00" x2="168.00" y2="100.00"/>
        <line x1="114.14" y1="114.14" x2="148.08" y2="148.08"/>
        <line x1="100.00" y1="120.00" x2="100.00" y2="168.00"/>
        <line x1="85.86"  y1="114.14" x2="51.92"  y2="148.08"/>
        <line x1="80.00"  y1="100.00" x2="32.00"  y2="100.00"/>
        <line x1="85.86"  y1="85.86"  x2="51.92"  y2="51.92"/>
        <line x1="100.00" y1="80.00"  x2="100.00" y2="32.00"/>
        <line x1="114.14" y1="85.86"  x2="148.08" y2="51.92"/>
      </g>

      <g stroke="#1B4F9C" stroke-width="14" stroke-linecap="round">
        <line x1="174.00" y1="100.00" x2="192.00" y2="100.00"/>
        <line x1="152.33" y1="152.33" x2="165.05" y2="165.05"/>
        <line x1="100.00" y1="174.00" x2="100.00" y2="192.00"/>
        <line x1="47.67"  y1="152.33" x2="34.95"  y2="165.05"/>
        <line x1="26.00"  y1="100.00" x2="8.00"   y2="100.00"/>
        <line x1="47.67"  y1="47.67"  x2="34.95"  y2="34.95"/>
        <line x1="100.00" y1="26.00"  x2="100.00" y2="8.00"/>
        <line x1="152.33" y1="47.67"  x2="165.05" y2="34.95"/>
      </g>

      <circle cx="100" cy="100" r="24" fill="url(#hubGradient)" stroke="#0F3A80" stroke-width="2"/>
    </g>
  </g>
</svg>
